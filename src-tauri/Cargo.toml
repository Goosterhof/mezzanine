[package]
name = "workbench"
version = "0.1.0"
description = "The Workbench — daily-driver Tauri cockpit for the Mad Scientist's laboratory"
authors = ["Gerard Oosterhof <gerard@kendo.dev>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# The Workbench's bench: serde for Tauri payloads, anyhow/thiserror for errors,
# chrono for chronicle timestamps, log for structured logging.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

# The Workbench's vise: portable-pty wraps wsl.exe (Windows) or bash (Linux dev)
# to host claude sessions inside a real terminal. tokio drives the async I/O
# pumps that read pty output and forward it to the frontend via Tauri events.
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"

[features]
custom-protocol = ["tauri/custom-protocol"]
