[package]
name = "mezzanine"
version = "0.2.5"
description = "The Mezzanine — the balcony overlooking the lab floor; dispatch mad scientists onto missions"
authors = ["Gerard Oosterhof <gerard@kendo.dev>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mezzanine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# The Ascent (#00056) — the balcony rebuilds itself. The updater checks
# GitHub Releases for a newer NSIS bundle and verifies its signature against
# the baked-in pubkey before installing; process drives the relaunch. The
# Mezzanine is desktop-only, so these need no mobile-target cfg guard.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The Mezzanine's instruments: serde for Tauri payloads, anyhow/thiserror for errors,
# chrono for chronicle timestamps, log for structured logging, uuid for ScientistId.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

# The bridge to the lab floor: portable-pty wraps wsl.exe (Windows) or bash (Linux dev)
# to host the dispatched scientist's claude session inside a real terminal. tokio drives
# the async I/O pumps that read pty output and forward it to the frontend via Tauri events.
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"

[features]
custom-protocol = ["tauri/custom-protocol"]

# The `test` feature on tauri unlocks `tauri::test::mock_app` + `MockRuntime`
# for the Phase O-1 chronicle reader integration tests (the tokio tail loop
# emits events through an AppHandle; the mock runtime accepts the emits
# without spinning a real webview).
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
