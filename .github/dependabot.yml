version: 2

updates:
    - package-ecosystem: npm
      directory: /
      target-branch: main
      schedule:
          interval: weekly
          day: monday
      groups:
          vue:
              patterns:
                  - 'vue'
                  - '@vue/*'
                  - 'vue-*'
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
      open-pull-requests-limit: 10
      labels:
          - dependencies

    # Tauri Rust backend — Cargo manifest lives under src-tauri/.
    - package-ecosystem: cargo
      directory: /src-tauri
      target-branch: main
      schedule:
          interval: weekly
          day: monday
      groups:
          tauri:
              patterns:
                  - 'tauri'
                  - 'tauri-*'
      open-pull-requests-limit: 10
      labels:
          - dependencies

    - package-ecosystem: github-actions
      directory: /
      target-branch: main
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - ci
